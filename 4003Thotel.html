<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>T Hotel 議論文 - 老師專屬 DeepSeek AI 批改平台</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- docx.js 用於生成 Word 文件 -->
    <script src="https://unpkg.com/docx@7.3.0/build/index.js"></script>
    <!-- FileSaver.js 用於觸發檔案下載 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <!-- mammoth.js 用於讀取 Word 檔內容 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@400;500;700&display=swap');
        body { font-family: 'Noto Sans HK', sans-serif; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col">

    <!-- 頂部導覽列 -->
    <header class="bg-slate-800 text-white shadow-md">
        <div class="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-lg font-bold">🍎 老師專屬 DeepSeek AI 批改與反饋後台</h1>
            <span class="text-xs bg-amber-600 px-2 py-1 rounded">教師權限</span>
        </div>
    </header>

    <!-- 主要內容區 -->
    <main class="max-w-4xl mx-auto px-4 py-8 flex-grow w-full space-y-6">

        <!-- 說明橫幅 -->
        <div class="bg-blue-50 border-l-4 border-blue-500 p-4 rounded-r-lg shadow-sm">
            <p class="text-sm text-blue-700 font-medium">
                👉 教師操作指引：請先設定 DeepSeek API Key，接著上傳學生小組交上來的 `.docx` 作業檔案，系統將自動進行 AI 智慧分析（重點考核：論點清晰度與論據充份性），確認後即可導出帶有批改反饋的檔案發還學生。
            </p>
        </div>

        <!-- 批改主面板 -->
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 space-y-6">
            
            <!-- API Key 設定 -->
            <div class="bg-indigo-50 p-4 rounded-lg border border-indigo-200 space-y-2">
                <label class="block text-xs font-bold text-indigo-900">🔑 設定 DeepSeek API Key</label>
                <input type="password" id="deepseek-api-key" class="w-full rounded-lg border border-indigo-300 p-2 text-xs bg-white" placeholder="sk-..." value="">
            </div>

            <!-- 上傳學生作業 -->
            <div class="bg-amber-50 p-4 rounded-lg border border-amber-200 space-y-3">
                <label class="block text-sm font-bold text-amber-900">📋 上傳學生小組作業 (.docx)</label>
                <input type="file" id="upload-student-doc" accept=".docx" onchange="handleStudentDocUpload(this)" class="w-full text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-amber-100 file:text-amber-800 hover:file:bg-amber-200">
                <p id="file-status" class="text-xs text-slate-500">尚未上傳檔案</p>
            </div>

            <!-- AI 執行按鈕 -->
            <div>
                <button onclick="runDeepSeekAI()" id="ai-btn" class="w-full bg-gradient-to-r from-indigo-600 to-purple-600 text-white py-3 rounded-xl font-bold text-sm hover:opacity-90 transition shadow flex items-center justify-center gap-2">
                    ✨ 啟動 DeepSeek AI 自動分析與批改
                </button>
            </div>

            <!-- 評分與評級結果 -->
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 border-t pt-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">建議總成績（滿分 100）</label>
                    <input type="number" id="teacher-score" class="w-full rounded-lg border border-slate-300 p-2.5 text-sm font-bold text-indigo-700" placeholder="分數">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">論點清晰度評級</label>
                    <select id="teacher-grade-thesis" class="w-full rounded-lg border border-slate-300 p-2.5 text-sm bg-white">
                        <option value="各分論點清晰明確，具備具體特質">各分論點清晰明確，具備具體特質</option>
                        <option value="論點尚算清晰，唯部分用詞較籠統">論點尚算清晰，唯部分用詞較籠統</option>
                        <option value="論點模糊，未能清晰點出核心">論點模糊，未能清晰點出核心</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">論據充份性評級</label>
                    <select id="teacher-grade-evidence" class="w-full rounded-lg border border-slate-300 p-2.5 text-sm bg-white">
                        <option value="論據充份，且清楚確實引述資料來源">論據充份，且清楚確實引述資料來源</option>
                        <option value="論據尚算充份，惟資料出處交代不夠完整">論據尚算充份，惟資料出處交代不夠完整</option>
                        <option value="論據空泛，未有確實引述相應資料">論據空泛，未有確實引述相應資料</option>
                    </select>
                </div>
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">DeepSeek AI 詳盡反饋與建議（可手動修改）</label>
                <textarea id="teacher-feedback" rows="6" class="w-full rounded-lg border border-slate-300 p-2.5 text-sm" placeholder="AI 分析結果將顯示於此..."></textarea>
            </div>

            <!-- 導出發還學生的 Word -->
            <div class="pt-4 border-t">
                <button onclick="exportTeacherWord()" class="w-full bg-emerald-600 text-white py-3 rounded-xl font-bold text-base hover:bg-emerald-700 transition shadow-lg flex items-center justify-center gap-2">
                    📥 導出包含【AI 批改反饋與成績】的 Word 檔案發還學生
                </button>
            </div>

        </div>

    </main>

    <!-- 頁尾 -->
    <footer class="bg-slate-200 text-slate-600 text-center py-4 text-xs mt-auto">
        T Hotel 老師專屬 AI 批改平台 © 2026
    </footer>

    <!-- JavaScript 邏輯控制 -->
    <script>
        let rawStudentTextForAI = "";
        let originalFileName = "小組作業";

        function handleStudentDocUpload(input) {
            const file = input.files[0];
            if (!file) return;
            originalFileName = file.name.replace(/\.[^/.]+$/, "");
            document.getElementById('file-status').innerText = `已載入檔案：${file.name}`;
            
            const reader = new FileReader();
            reader.onload = function(loadEvent) {
                mammoth.extractRawText({ arrayBuffer: loadEvent.target.result }).then(result => {
                    rawStudentTextForAI = result.value;
                });
            };
            reader.readAsArrayBuffer(file);
        }

        async function runDeepSeekAI() {
            const apiKey = document.getElementById('deepseek-api-key').value.trim();
            if (!apiKey) {
                alert("請先輸入您的 DeepSeek API Key！");
                return;
            }
            if (!rawStudentTextForAI) {
                alert("請先上傳學生的作業 Word 檔案！");
                return;
            }

            const aiBtn = document.getElementById('ai-btn');
            aiBtn.innerText = "⏳ DeepSeek AI 正在分析論點清晰度與論據充份性...";
            aiBtn.disabled = true;

            const prompt = `你是一位資深的中文科老師。現在需要批改一份關於香港 T Hotel 考察的議論文小組作業。
批改重點考核兩個核心能力：
1. 論點清晰度：分論點是否清晰明確、具備具體特質（例如：寫出「酒店環境優美寧靜」而非籠統的「酒店環境」）。
2. 論據充份性：論據是否充份，且是否確實引述相應的資料來源、數據或旅客評語。

以下是學生作業內容：
"""
${rawStudentTextForAI}
"""

請嚴格且專業地給出以下 JSON 格式回覆（切勿包含額外 markdown 標記外字眼，確保可被 JSON.parse 解析）：
{
  "score": 85,
  "thesisGrade": "各分論點清晰明確，具備具體特質",
  "evidenceGrade": "論據充份，且清楚確實引述資料來源",
  "feedback": "詳細的批改反饋與改進建議，請針對學生的論點與論據表現給予具體指點（繁體中文）"
}`;

            try {
                const response = await fetch("https://api.deepseek.com/chat/completions", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${apiKey}`
                    },
                    body: JSON.stringify({
                        model: "deepseek-chat",
                        messages: [{ role: "user", content: prompt }],
                        temperature: 0.3
                    })
                });

                const data = await response.json();
                let resultText = data.choices[0].message.content;
                resultText = resultText.replace(/```json/g, '').replace(/```/g, '').trim();
                let aiResult = JSON.parse(resultText);

                document.getElementById('teacher-score').value = aiResult.score || 85;
                document.getElementById('teacher-grade-thesis').value = aiResult.thesisGrade || "論點尚算清晰，唯部分用詞較籠統";
                document.getElementById('teacher-grade-evidence').value = aiResult.evidenceGrade || "論據尚算充份，惟資料出處交代不夠完整";
                document.getElementById('teacher-feedback').value = aiResult.feedback || "AI 批改完成。";

                alert("DeepSeek AI 智慧批改完成！");
            } catch (error) {
                console.error(error);
                alert("AI 批改請求失敗，請檢查 API Key 是否正確或網絡連接。");
            } finally {
                aiBtn.innerText = "✨ 啟動 DeepSeek AI 自動分析與批改";
                aiBtn.disabled = false;
            }
        }

        function exportTeacherWord() {
            const { Document, Packer, Paragraph, TextRun } = window.docx;

            const score = document.getElementById('teacher-score').value || "未評分";
            const gradeThesis = document.getElementById('teacher-grade-thesis').value;
            const gradeEvidence = document.getElementById('teacher-grade-evidence').value;
            const feedback = document.getElementById('teacher-feedback').value || "無";

            const doc = new Document({
                sections: [{
                    properties: {},
                    children: [
                        new Paragraph({ alignment: window.docx.AlignmentType.CENTER, children: [new TextRun({ text: "T Hotel 議論文作業 - 教師批改反饋", bold: true, size: 32, font: "Microsoft JhengHei" })] }),
                        new Paragraph({ spacing: { after: 300 }, children: [] }),
                        
                        // 批改結果摘要
                        new Paragraph({ spacing: { after: 100 }, children: [new TextRun({ text: `【DeepSeek AI 批改與反饋報告】總成績：${score} 分`, bold: true, size: 24, color: "b91c1c", font: "Microsoft JhengHei" })] }),
                        new Paragraph({ spacing: { after: 100 }, children: [new TextRun({ text: `• 論點清晰度評級：${gradeThesis}`, size: 20, font: "Microsoft JhengHei" })] }),
                        new Paragraph({ spacing: { after: 200 }, children: [new TextRun({ text: `• 論據充份性評級：${gradeEvidence}`, size: 20, font: "Microsoft JhengHei" })] }),
                        new Paragraph({ spacing: { after: 300 }, children: [new TextRun({ text: `詳盡反饋與建議：${feedback}`, size: 20, color: "333333", font: "Microsoft JhengHei" })] }),

                        new Paragraph({ spacing: { after: 200 }, children: [new TextRun({ text: "--------------------------------------------------", color: "888888" })] }),
                        new Paragraph({ spacing: { after: 200 }, children: [new TextRun({ text: "【學生原作業內容摘要】", bold: true, size: 22, font: "Microsoft JhengHei" })] }),
                        new Paragraph({ children: [new TextRun({ text: rawStudentTextForAI || "無內容", size: 20, font: "Microsoft JhengHei" })] })
                    ]
                }]
            });

            Packer.toBlob(doc).then(blob => {
                saveAs(blob, `${originalFileName}_已批改.docx`);
            });
        }
    </script>
</body>
</html>
